<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NotesSettings · NextThought</title>
<link rel="stylesheet" href="../design-system/tokens.css"><link rel="stylesheet" href="../design-system/components.css">
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500&display=swap">
<div class="x" style="padding:56px 40px 40px;position:relative">
<div class="x-lang"><span data-l="zh" class="is-on">中文</span><span data-l="en">EN</span></div>
<div class="x-card" style="max-width:620px;padding:22px 24px;display:flex;flex-direction:column;gap:18px">
<div><div style="font-weight:600"><span class="zh">纪要</span><span class="en">Notes</span></div><div class="x-cap" style="margin-top:4px"><span class="zh">会后整理不追求快，追求准确和详细，所以和会中回答分开设置。</span><span class="en">After the meeting accuracy matters more than speed, so notes have their own settings.</span></div></div>
<div class="x-row"><span class="x-grow"><span class="zh">纪要模型</span><span class="en">Notes model</span></span><span class="x-model is-open">gpt-5.5 · <span class="zh">推理：高</span><span class="en">Reasoning: high</span> <svg class="x-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></div>
<div class="x-row"><span class="x-grow"><span class="zh">结束后自动整理</span><span class="en">Write notes when the meeting ends</span></span><span class="x-switch"></span></div>
<div class="x-row"><span class="x-grow"><span class="zh">纪要语言</span><span class="en">Notes language</span></span><span class="x-cap"><span class="zh">跟随界面</span><span class="en">Same as app</span></span></div>
<div class="x-row"><span class="x-grow"><span class="zh">模板</span><span class="en">Templates</span><div class="x-cap"><span class="zh">7 个内置 · 1 个自定义</span><span class="en">7 built-in · 1 custom</span></div></span><button class="x-btn"><span class="zh">管理模板…</span><span class="en">Manage…</span></button></div>
</div>
<script>
(function(){var root=document.currentScript.parentElement;root.querySelectorAll('.x-lang span').forEach(function(b){b.onclick=function(){root.setAttribute('data-lang',b.dataset.l);root.querySelectorAll('.x-lang span').forEach(function(o){o.classList.toggle('is-on',o===b)});};});})();
</script>
</div>
</body></html>
