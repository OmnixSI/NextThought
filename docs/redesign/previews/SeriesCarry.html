<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SeriesCarry · InterviewHacker</title>
<link rel="stylesheet" href="../design-system/tokens.css"><link rel="stylesheet" href="../design-system/components.css">
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500&display=swap">
<div class="x" style="padding:56px 40px 40px;position:relative">
<div class="x-lang"><span data-l="zh" class="is-on">中文</span><span data-l="en">EN</span></div>
<div style="max-width:680px"><div class="x-carry">
 <div class="x-row" style="gap:10px"><span style="color:var(--ink-secondary)"><svg class="x-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 8 4-8 4-8-4 8-4z"/><path d="m4 12 8 4 8-4M4 16l8 4 8-4"/></svg></span><div class="x-grow"><div style="font-weight:500"><span class="zh">这是「字节跳动 · 后端」的第 2 场</span><span class="en">Round 2 of “ByteDance · Backend”</span></div><div class="x-cap" style="margin-top:2px"><span class="zh">上一场：一面 · 10 月 22 日</span><span class="en">Last time: Round 1 · Oct 22</span></div></div><button class="x-btn is-ghost"><span class="zh">不是同一个系列</span><span class="en">Not the same series</span></button></div>
 <div class="x-carry-list">
  <label><span class="x-box is-on"><svg class="x-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg></span><span class="x-grow"><span class="zh">资料 · 简历、职位描述</span><span class="en">Materials · Resume, job description</span></span><span class="x-cap"><span class="zh">2 份</span><span class="en">2 files</span></span></label>
  <label><span class="x-box is-on"><svg class="x-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg></span><span class="x-grow"><span class="zh">一面复盘 · 改进后的答法</span><span class="en">Round 1 review · improved answers</span></span><span class="x-cap"><span class="zh">6 题 · 2 题待改进</span><span class="en">6 questions · 2 to improve</span></span></label>
  <label><span class="x-box is-on"><svg class="x-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg></span><span class="x-grow"><span class="zh">经验 · “项目讲数字”“先说结论”</span><span class="en">Lessons · “Use numbers”, “Lead with the answer”</span></span><span class="x-cap"><span class="zh">3 条</span><span class="en">3</span></span></label>
  <label><span class="x-box"></span><span class="x-grow" style="color:var(--ink-secondary)"><span class="zh">一面完整转写</span><span class="en">Full round 1 transcript</span></span><span class="x-cap"><span class="zh">42 分钟</span><span class="en">42 min</span></span></label>
 </div></div></div>
<script>
(function(){var root=document.currentScript.parentElement;root.querySelectorAll('.x-lang span').forEach(function(b){b.onclick=function(){root.setAttribute('data-lang',b.dataset.l);root.querySelectorAll('.x-lang span').forEach(function(o){o.classList.toggle('is-on',o===b)});};});})();
</script>
</div>
</body></html>
