<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeetingType · InterviewHacker</title>
<link rel="stylesheet" href="../design-system/tokens.css"><link rel="stylesheet" href="../design-system/components.css">
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500&display=swap">
<div class="x" style="padding:56px 40px 40px;position:relative">
<div class="x-lang"><span data-l="zh" class="is-on">中文</span><span data-l="en">EN</span></div>
<div style="display:flex;flex-direction:column;gap:14px;max-width:680px"><div class="x-chips"><span class="is-on"><span class="zh">通用</span><span class="en">General</span></span><span class=""><span class="zh">面试</span><span class="en">Interview</span></span><span class=""><span class="zh">汇报 / 答辩</span><span class="en">Presentation</span></span><span class=""><span class="zh">组会</span><span class="en">Lab meeting</span></span><span class=""><span class="zh">工作会议</span><span class="en">Work meeting</span></span><span class=""><span class="zh">客户沟通</span><span class="en">Client call</span></span><span class=""><span class="zh">讲座 / 课程</span><span class="en">Lecture</span></span><span class=""><span class="zh">小组讨论</span><span class="en">Group discussion</span></span><span class="is-add"><svg class="x-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="zh">自定义…</span><span class="en">Custom…</span></span></div><div class="x-cap"><span class="zh">通用：只记录，需要时按 ⌘⇧↩ 回答 · 会后出总结、决定和待办</span><span class="en">General: notes only, press ⌘⇧↩ when you need an answer · summary, decisions and action items afterwards</span></div></div>
<script>
(function(){var root=document.currentScript.parentElement;root.querySelectorAll('.x-lang span').forEach(function(b){b.onclick=function(){root.setAttribute('data-lang',b.dataset.l);root.querySelectorAll('.x-lang span').forEach(function(o){o.classList.toggle('is-on',o===b)});};});})();
</script>
</div>
</body></html>
