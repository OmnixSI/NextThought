name: 问题反馈
description: 软件出错、识别或回答异常
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: 版本, placeholder: "例如 0.2.0-beta.1（关于本机 / Release 名称）" }
    validations: { required: true }
  - type: input
    id: macos
    attributes: { label: macOS 版本与芯片, placeholder: "例如 macOS 26.1 · M4" }
  - type: dropdown
    id: engines
    attributes:
      label: 使用的引擎
      multiple: true
      options: [本机 Zipformer, Apple Speech, 云端 Soniox, 云端 OpenAI, 云端 Deepgram, Codex 常驻服务, Codex exec, OpenAI 兼容 API]
  - type: textarea
    id: what
    attributes: { label: 发生了什么, description: 复现步骤、期望结果与实际结果 }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: 诊断信息（可选）
      description: "~/Library/Application Support/InterviewHacker/diagnostics/ 下最新的 events-*.jsonl 中相关几行。日志不含转录正文，但请自行检查后再粘贴。"
      render: text
