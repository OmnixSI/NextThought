name: Native Companion Manual Build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Mobile/Shared
      - run: xcodebuild -project Mobile/iOS/InterviewHackerCompanion.xcodeproj -scheme InterviewHackerCompanion -destination 'generic/platform=iOS Simulator' -derivedDataPath Mobile/iOS/DerivedData CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-simulator-app
          path: Mobile/iOS/DerivedData/Build/Products/Debug-iphonesimulator/InterviewHackerCompanion.app
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: cd Mobile/Android && ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: Android-debug-APK
          path: Mobile/Android/app/build/outputs/apk/debug/app-debug.apk
