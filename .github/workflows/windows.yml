name: Windows build, verification and release packaging
on:
  workflow_dispatch:
  push:
    paths: ['Windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', '.github/workflows/windows.yml']
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Windows
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare pinned SDK
        run: python scripts/bootstrap_sdk.py
      - name: Prepare Inno Setup toolchain
        run: ./scripts/bootstrap_installer.ps1
      - name: Verify (tests, UTC pass, Mac fixtures; screenshots need a desktop session)
        run: ./verify.ps1 -SkipScreenshots
      - name: Release pipeline (publish, unsigned installer, checksums)
        run: |
          [xml]$project = Get-Content src/NextThought.Desktop/NextThought.Desktop.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          ./release.ps1 -Version $version -Ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: NextThought-Windows-${{ github.sha }}
          path: |
            Windows/artifacts/release/*/NextThought-*-windows-x64-setup.exe
            Windows/artifacts/release/*/SHA256SUMS.txt
            Windows/artifacts/release/*/update.json
            Windows/artifacts/release/*/RELEASE_NOTES.md
            Windows/artifacts/verify/*.trx
          retention-days: 14
