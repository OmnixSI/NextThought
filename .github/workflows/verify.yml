name: Verify
# macOS minutes count 10× against the Actions quota, so each commit is verified once:
# pushes to these branches run here; pull requests only run for branches from forks
# (a branch in this repository was already verified by its push). Docs-only commits
# (README, screenshots, release notes) are skipped.
on:
  push:
    branches: [main, improve/realtime-workspace, 'claude/**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build and test
        run: swift test --disable-sandbox
      - name: Release build
        run: swift build --disable-sandbox -c release
      - name: Source snapshot for reproducible review
        if: always()
        run: tar -czf source-snapshot.tar.gz Package.swift Sources Tests Resources scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-source-${{ github.sha }}
          path: source-snapshot.tar.gz
          retention-days: 2
          if-no-files-found: error
  selftest:
    # Runs the real app binary headlessly: data round trip, local signing,
    # the updater against this repository's releases, and the X-ASR pipeline.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: |
          swift build --disable-sandbox -c release
          bin="$(swift build --disable-sandbox -c release --show-bin-path)/InterviewHacker"
          app="$RUNNER_TEMP/InterviewHacker.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$bin" "$app/Contents/MacOS/InterviewHacker"
          cp Resources/Info.plist "$app/Contents/Info.plist"
          codesign --force --sign - --identifier com.interviewhacker.app "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: Cache X-ASR models
        uses: actions/cache@v4
        with:
          path: ~/ih-selftest/models
          key: xasr-zh-en-2026-06-v1
      - name: Self-test · data round trip
        timeout-minutes: 5
        env: { INTERVIEWHACKER_DATA_DIR: /Users/runner/ih-selftest }
        run: |
          mkdir -p "$INTERVIEWHACKER_DATA_DIR"
          "$APP/Contents/MacOS/InterviewHacker" --self-test data
      - name: Self-test · local signing
        if: success() || failure()
        timeout-minutes: 5
        env: { INTERVIEWHACKER_DATA_DIR: /Users/runner/ih-selftest, INTERVIEWHACKER_SKIP_CERT_TRUST: "1" }
        run: '"$APP/Contents/MacOS/InterviewHacker" --self-test signing'
      - name: Self-test · updater
        if: success() || failure()
        timeout-minutes: 8
        env:
          INTERVIEWHACKER_DATA_DIR: /Users/runner/ih-selftest
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$APP/Contents/MacOS/InterviewHacker" --self-test update --repo "${{ github.repository }}"'
      - name: Self-test · X-ASR two-pass recognition
        if: success() || failure()
        timeout-minutes: 12
        env: { INTERVIEWHACKER_DATA_DIR: /Users/runner/ih-selftest }
        run: '"$APP/Contents/MacOS/InterviewHacker" --self-test asr --fixtures Tools/Validation/Fixtures'
