name: Verify
on:
  push:
    branches: [main, improve/realtime-workspace, 'claude/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build and test
        run: swift test --disable-sandbox
      - name: Release build
        run: swift build --disable-sandbox -c release
      - name: Source snapshot for reproducible review
        if: always()
        run: tar -czf source-snapshot.tar.gz Package.swift Sources Tests Resources scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-source-${{ github.sha }}
          path: source-snapshot.tar.gz
          retention-days: 2
          if-no-files-found: error
  selftest:
    # Runs the real app binary headlessly: data round trip, local signing,
    # the updater against this repository's releases, and the X-ASR pipeline.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: |
          swift build --disable-sandbox -c release
          bin="$(swift build --disable-sandbox -c release --show-bin-path)/InterviewHacker"
          app="$RUNNER_TEMP/InterviewHacker.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$bin" "$app/Contents/MacOS/InterviewHacker"
          cp Resources/Info.plist "$app/Contents/Info.plist"
          codesign --force --sign - --identifier com.interviewhacker.app "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: Cache X-ASR models
        uses: actions/cache@v4
        with:
          path: ~/ih-selftest/models
          key: xasr-zh-en-2026-06-v1
      - name: Self-test
        env:
          INTERVIEWHACKER_DATA_DIR: /Users/runner/ih-selftest
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$INTERVIEWHACKER_DATA_DIR"
          "$APP/Contents/MacOS/InterviewHacker" --self-test data signing update asr \
            --fixtures Tools/Validation/Fixtures --repo "${{ github.repository }}" 2>&1 | tee selftest.log
          grep -q "SELFTEST all passed" selftest.log
