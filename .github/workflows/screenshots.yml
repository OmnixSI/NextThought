name: Screenshots
# Renders README screenshots on a real macOS runner using the app's demo mode
# (sample data, no audio or network). Run manually, or push a commit whose message
# contains "[screenshots]". Images are uploaded as the "screenshots" artifact.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
permissions:
  contents: write
jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle (static Zipformer runtime)
        run: |
          swift build --disable-sandbox -c release
          bin="$(swift build --disable-sandbox -c release --show-bin-path)/InterviewHacker"
          app="$RUNNER_TEMP/InterviewHacker.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$bin" "$app/Contents/MacOS/InterviewHacker"
          cp Resources/Info.plist "$app/Contents/Info.plist"
          swift scripts/make-icon.swift "$RUNNER_TEMP/AppIcon.iconset" && iconutil -c icns "$RUNNER_TEMP/AppIcon.iconset" -o "$app/Contents/Resources/AppIcon.icns" || true
          codesign --force --sign - "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: Capture
        run: |
          mkdir -p shots
          sw_vers
          capture() {
            local appearance="$1" section="$2" out="$RUNNER_TEMP/windows-$1-$2.json"
            rm -f "$out"
            INTERVIEWHACKER_DEMO=1 INTERVIEWHACKER_DEMO_APPEARANCE="$appearance" INTERVIEWHACKER_DEMO_SECTION="$section" \
              INTERVIEWHACKER_DEMO_OUT="$out" "$APP/Contents/MacOS/InterviewHacker" >"$RUNNER_TEMP/app-$1-$2.log" 2>&1 &
            local pid=$!
            for _ in $(seq 1 40); do [[ -s "$out" ]] && break; sleep 0.5; done
            sleep 1.5
            if [[ -s "$out" ]]; then
              main=$(python3 -c "import json;print(json.load(open('$out'))['main'])")
              panel=$(python3 -c "import json;print(json.load(open('$out'))['teleprompter'])")
              screencapture -x -l "$main" "shots/$section-$appearance.png" || echo "window capture failed"
              if [[ "$section" == assistant && "$panel" != 0 ]]; then
                screencapture -x -l "$panel" "shots/teleprompter-$appearance.png" || true
                true
              fi
            else
              echo "demo window list not written for $appearance/$section"
              tail -n 40 "$RUNNER_TEMP/app-$appearance-$section.log" || true
              # Crash reports explain a trap (fatal error, exclusivity violation…).
              report=$(ls -t ~/Library/Logs/DiagnosticReports/InterviewHacker*.ips 2>/dev/null | head -1)
              if [[ -n "$report" ]]; then
                python3 - "$report" <<'PY' || head -c 6000 "$report"
          import json, sys
          text = open(sys.argv[1]).read()
          header, _, body = text.partition("\n")
          data = json.loads(body)
          print("exception:", data.get("exception"), data.get("termination", {}).get("indicator"))
          for key in ("asi", "crashReason"):
              if key in data: print(key, data[key])
          images = data.get("usedImages", [])
          thread = next((t for t in data.get("threads", []) if t.get("triggered")), None)
          for frame in (thread or {}).get("frames", [])[:30]:
              image = images[frame.get("imageIndex", 0)].get("name", "?") if images else "?"
              print(f"  {image:28s} {frame.get('symbol', '?')}  +{frame.get('symbolLocation', 0)}  {frame.get('sourceFile', '')}:{frame.get('sourceLine', '')}")
          PY
              fi
            fi
            kill "$pid" 2>/dev/null || true
            sleep 1
          }
          for appearance in dark light; do
            for section in assistant materials settings history; do capture "$appearance" "$section"; done
          done
          ls -la shots
      - name: Commit screenshots to docs/screenshots
        run: |
          mkdir -p docs/screenshots
          for f in shots/*.png; do
            # Keep the repository small: downscale to at most 1600 px on the long side.
            sips -Z 1600 "$f" --out "docs/screenshots/$(basename "$f")" >/dev/null
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "No screenshot changes"; exit 0; fi
          git commit -m "docs: update screenshots from demo mode"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn
          retention-days: 14
