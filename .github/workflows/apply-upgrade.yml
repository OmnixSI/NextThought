name: Apply reviewed realtime upgrade
on:
  push:
    branches: [improve/realtime-workspace]
    paths:
      - '.github/realtime-upgrade/**'
      - '.github/workflows/apply-upgrade.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'ooooooomygosh/InterviewHacker' && github.ref == 'refs/heads/improve/realtime-workspace'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply hash-checked source edits
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, hashlib
          from pathlib import Path
          root = Path.cwd().resolve()
          payloads = sorted(Path('.github/realtime-upgrade').glob('part-*.txt'))
          assert len(payloads) == 6, 'Incomplete source payload'
          seen = set()
          for payload in payloads:
              for record in ast.literal_eval(payload.read_text()):
                  relative = Path(record['path'])
                  assert not relative.is_absolute() and '..' not in relative.parts
                  assert relative.parts[0] in {'Sources', 'Tests', 'Resources', 'scripts'}
                  assert str(relative) not in seen
                  seen.add(str(relative))
                  target = root / relative
                  assert target.resolve().is_relative_to(root) and not target.is_symlink()
                  original = target.read_bytes() if target.exists() else b''
                  assert hashlib.sha256(original).hexdigest() == record['old'], f'Base hash mismatch: {relative}'
                  lines = original.decode('utf-8').splitlines(keepends=True)
                  previous = 0
                  for start, end, text in record['edits']:
                      assert 0 <= previous <= start <= end <= len(lines)
                      assert isinstance(text, str)
                      previous = end
                  for start, end, text in reversed(record['edits']):
                      lines[start:end] = text.splitlines(keepends=True)
                  result = ''.join(lines)
                  # Correct one duplicated transport line; the declared target hash
                  # is still mandatory and proves the final reviewed file is exact.
                  if str(relative) == 'Sources/InterviewHacker/LocalWhisperService.swift':
                      duplicate = '            self.continuation = continuation\n' * 2
                      assert result.count(duplicate) == 1
                      result = result.replace(duplicate, '            self.continuation = continuation\n', 1)
                  data = result.encode('utf-8')
                  assert hashlib.sha256(data).hexdigest() == record['new'], f'Target hash mismatch: {relative}'
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  print(f'Verified {relative}')
          print(f'Applied {len(seen)} exact source changes')
          PY
      - name: Native build and regression tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -version
          swift --version
          swift test --disable-sandbox 2>&1 | tee native-test.log
      - name: Review snapshot
        if: always()
        run: tar -czf native-source.tar.gz Package.swift Sources Tests Resources scripts native-test.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-upgrade-${{ github.sha }}
          path: |
            native-source.tar.gz
            native-test.log
          retention-days: 2
      - name: Publish verified source and remove temporary transport
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources Tests Resources scripts
          git rm -r .github/realtime-upgrade .github/workflows/apply-upgrade.yml
          git commit -m 'feat: realtime speech, grounded session workspace and teleprompter'
          git push origin HEAD:improve/realtime-workspace
