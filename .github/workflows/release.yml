name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Validated release tag'
        required: true
        default: v1.8.0
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ vars.MAC_RUNNER == 'github' && 'macos-latest' || fromJSON('["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Test
        run: |
          swift --version
          swift test --disable-sandbox
          Tools/Validation/CodexTransport/run.sh
          Tools/Validation/LegacyOffice/run.sh
          python3 -m unittest discover -s Tools/Validation/Documents -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Companion protocols and iOS SDK build
        run: scripts/verify-companions.sh --require-ios
      - name: Acquire the fixed runtime asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          asset=$(python3 -c 'import json; print(json.load(open("Resources/DocumentRuntime/runtime-manifest.json"))["asset"])')
          if [[ -n "${NEXTTHOUGHT_RUNTIME_ASSET:-}" && -f "$NEXTTHOUGHT_RUNTIME_ASSET" ]]; then
            cp "$NEXTTHOUGHT_RUNTIME_ASSET" "dist/$asset"
          else
            gh release download v1.7.0 --pattern "$asset" --dir dist --clobber
          fi
          python3 - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open('Resources/DocumentRuntime/runtime-manifest.json'));p=pathlib.Path('dist')/m['asset']
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()==m['sha256']
          assert p.stat().st_size==m['downloadBytes']
          PY
          cp Resources/DocumentRuntime/runtime-manifest.json dist/runtime-manifest.json
      - name: Import the release signing certificate
        if: ${{ vars.MAC_RUNNER == 'github' }}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          # The fixed release identity (scripts/setup-release-signing.sh), so macOS keeps privacy
          # permissions across versions. Without the secrets the build stays ad-hoc signed.
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" || -z "$MACOS_CERTIFICATE_PASSWORD" || -z "$MACOS_SIGNING_IDENTITY" ]]; then
            echo "No release signing secrets; this build will be ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/release-identity.p12"
          security import "$RUNNER_TEMP/release-identity.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/release-identity.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"
          echo "NEXTTHOUGHT_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "NEXTTHOUGHT_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build signed App, ZIP and DMG
        env:
          NEXTTHOUGHT_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          NEXTTHOUGHT_MAKE_DMG: '1'
        run: |
          export NEXTTHOUGHT_VERSION="${NEXTTHOUGHT_VERSION#v}"
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && -z "${NEXTTHOUGHT_SIGNING_IDENTITY:-}" ]]; then export NEXTTHOUGHT_SIGNING_IDENTITY=-; fi
          scripts/build-app.sh
      - name: Isolated data selftest
        env:
          NEXTTHOUGHT_DATA_DIR: ${{ runner.temp }}/ih-release-selftest
        run: |
          ci="$RUNNER_TEMP/NextThought-ci.app"
          cp -R dist/NextThought.app "$ci"
          plutil -replace CFBundleIdentifier -string com.nextthought.app.ci "$ci/Contents/Info.plist"
          codesign --force --sign - --identifier com.nextthought.app.ci "$ci"
          "$ci/Contents/MacOS/NextThought" --self-test data
          "$ci/Contents/MacOS/NextThought" --self-test session-export
          "$ci/Contents/MacOS/NextThought" --self-test session-backup-drain
          "$ci/Contents/MacOS/NextThought" --self-test session-edit-receipts
          "$ci/Contents/MacOS/NextThought" --self-test session-carry-context
          NEXTTHOUGHT_DEMO=1 "$ci/Contents/MacOS/NextThought" --self-test document-setup
      - name: Stage and validate all release assets
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 Tools/DocumentRuntime/release_assets.py --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)"
      - name: Test release checksum manifest
        run: python3 -m unittest discover -s Tools/Validation/ReleaseAssets -p 'test_*.py'
      - name: Upload to draft, verify, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "NextThought $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          assets=()
          while IFS= read -r asset; do
            [[ -n "$asset" ]] && assets+=("dist/$asset")
          done < dist/release-assets.txt
          if [[ ${#assets[@]} -eq 0 ]]; then echo "The release asset list is empty." >&2; exit 1; fi
          gh release upload "$RELEASE_TAG" \
            "${assets[@]}" \
            dist/SHA256SUMS.txt --clobber
          expected_assets="$(cat dist/release-assets.txt; printf '%s\n' SHA256SUMS.txt)"
          expected_assets="$(printf '%s\n' "$expected_assets" | LC_ALL=C sort)"
          actual_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | sort | .[]')"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Attached release assets differ from the generated upload list." >&2
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          fi
          verify="$RUNNER_TEMP/release-verification"
          mkdir -p "$verify"
          gh release download "$RELEASE_TAG" --dir "$verify" --clobber
          (cd "$verify" && shasum -a 256 -c SHA256SUMS.txt)
          gh release edit "$RELEASE_TAG" --draft=false --latest
