name: Release
# Builds the macOS app on GitHub's Apple Silicon runners and publishes a GitHub
# Release with a DMG and a ZIP. Trigger it by any of:
# - pushing a tag like `v0.2.0`;
# - pushing a commit to main or a claude/** branch whose message contains
#   `[release v0.2.0]` (the tag is created on that commit);
# - running it manually from the Actions tab (workflow must be on the default branch).
#
# Signing:
# - Default: ad-hoc signature (no Apple account needed). Users approve the app
#   once in System Settings → Privacy & Security → "Open Anyway".
# - Optional Developer ID signing + notarization when these repository secrets exist:
#   MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY
#   (e.g. "Developer ID Application: Name (TEAMID)"), and for notarization
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD.
on:
  push:
    tags: ['v*']
    branches: [main, 'claude/**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v0.2.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[release v')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then tag="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"
          else tag="$(printf '%s' "$MESSAGE" | grep -oE '\[release v[0-9][0-9A-Za-z.+-]*\]' | head -1 | sed -E 's/^\[release (.*)\]$/\1/')"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release tag: '$tag'" >&2; exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Releasing $tag from $GITHUB_SHA"
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          cmake --version
      - name: Test
        run: swift test --disable-sandbox
      - name: Import Developer ID certificate (optional)
        id: cert
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$P12" || -z "$IDENTITY" ]]; then
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "No signing certificate configured; using ad-hoc signing."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A self-signed identity (scripts/setup-release-signing.sh) must be trusted
          # for code signing; Developer ID certificates are already trusted.
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "$IDENTITY"; then
            /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -clcerts -nokeys -passin "pass:$P12_PASSWORD" -out "$RUNNER_TEMP/cert.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
            rm -f "$RUNNER_TEMP/cert.pem"
          fi
          security find-identity -v -p codesigning "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          [[ "$IDENTITY" == *"Developer ID"* ]] && echo "developer_id=1" >> "$GITHUB_OUTPUT" || echo "developer_id=0" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
      - name: Build app, ZIP and DMG
        env:
          INTERVIEWHACKER_SIGNING_IDENTITY: ${{ steps.cert.outputs.identity }}
          INTERVIEWHACKER_SIGNING_KEYCHAIN: ${{ steps.cert.outputs.keychain }}
          # Hardened runtime only for Developer ID (needed for notarization).
          INTERVIEWHACKER_HARDENED_RUNTIME: ${{ steps.cert.outputs.developer_id == '1' && '1' || '0' }}
          INTERVIEWHACKER_MAKE_DMG: '1'
          INTERVIEWHACKER_BUILD_JOBS: '6'
          INTERVIEWHACKER_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # CFBundleShortVersionString must be numeric: v0.3.0-beta.1 -> 0.3.0
          version="${TAG#v}"
          export INTERVIEWHACKER_VERSION="${version%%[-+]*}"
          ./scripts/build-app.sh
      - name: Notarize (optional)
        if: steps.cert.outputs.developer_id == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_TEAM_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            echo "Notarization secrets not configured; skipping."
            exit 0
          fi
          xcrun notarytool submit dist/InterviewHacker.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple dist/InterviewHacker.dmg
      - name: Name artifacts and checksums
        run: |
          version="${TAG#v}"
          mv dist/InterviewHacker.dmg "dist/InterviewHacker-${version}-macOS-arm64.dmg"
          mv dist/InterviewHacker-macOS.zip "dist/InterviewHacker-${version}-macOS-arm64.zip"
          cd dist && shasum -a 256 InterviewHacker-*-macOS-arm64.* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
        run: |
          notes="docs/releases/${TAG}.md"
          flags=()
          [[ -f "$notes" ]] && flags+=(--notes-file "$notes") || flags+=(--generate-notes)
          [[ "$PRERELEASE" == "true" || "$TAG" == *-* ]] && flags+=(--prerelease)
          files=(dist/InterviewHacker-*-macOS-arm64.dmg dist/InterviewHacker-*-macOS-arm64.zip dist/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "InterviewHacker ${TAG}" --target "$GITHUB_SHA" "${flags[@]}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InterviewHacker-${{ env.TAG || github.sha }}
          path: dist/InterviewHacker-*
          if-no-files-found: ignore
          retention-days: 14
