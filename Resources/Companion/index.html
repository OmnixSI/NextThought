<html lang="zh-CN"><head><meta charset="utf-8">

<style>
:root{color-scheme:dark light;--bg:#141419;--card:#1e1f27;--text:#f2f1f7;--muted:#b0afbf;--accent:#bdb3ff;--primary:#5754d8;--line:#363640;--focus:#c8c0ff}
@media(prefers-color-scheme:light){:root{--bg:#f5f5f9;--card:#fff;--text:#20212b;--muted:#626171;--accent:#5146c8;--primary:#5146c8;--line:#dcdce7;--focus:#5146c8}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
header,main,.controls{width:100%;max-width:900px;margin:0 auto}
header{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 16px 0;color:var(--muted);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}.live .dot{background:#34c759}
#s{flex:1;min-width:120px}#mode{width:100%;overflow-wrap:anywhere}.size{display:flex;gap:4px}
main{flex:1;padding:12px 16px 24px}.history{display:flex;align-items:center;gap:12px;margin-bottom:12px}.history button{background:transparent;border:1px solid var(--line);font-size:14px}.history #p{flex:1;text-align:center;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
#q{margin:12px 0;font-size:17px;font-weight:600;overflow-wrap:anywhere}#q:empty{display:none}
#a{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:30vh;line-height:1.6}
#a strong{font-weight:650}#a code{font-family:ui-monospace,monospace;font-size:.88em;background:var(--bg);border-radius:4px;padding:1px 4px}
#cand,#sources{font-size:13px;color:var(--muted);margin-top:12px;overflow-wrap:anywhere}#cand:empty,#sources:empty{display:none}
nav{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:2}.controls{display:flex;flex-direction:column;gap:8px}.actions{display:flex;gap:8px}.actions button{flex:1;min-width:0}
button{border:1px solid transparent;border-radius:12px;min-height:44px;min-width:44px;padding:10px 12px;font:inherit;font-size:15px;background:var(--card);color:var(--text);cursor:pointer;touch-action:manipulation}button.primary{background:var(--primary);color:white;font-weight:600}button.secondary{border-color:var(--line)}button:disabled{opacity:.48;cursor:default}button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}button[hidden]{display:none}button:active:not(:disabled){filter:brightness(.94)}
#operation{font-size:13px;color:var(--muted);overflow-wrap:anywhere}#operation:empty{display:none}#operation[data-error="true"]{color:var(--text)}[data-retry]{align-self:flex-start;border-color:var(--line)}#update{margin-top:12px;border-color:var(--line)}
@media(min-width:700px){header{padding-top:20px}nav{padding-top:12px;padding-bottom:16px}.actions button{flex:0 1 180px}#a{min-height:40vh}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<header id="h"><span class="dot" aria-hidden="true"></span><span id="s" role="status" data-i18n="connecting">连接中…</span>
<span class="size"><button data-zoom="-2" aria-label="减小回答字号" data-i18n-aria="decreaseAnswerFont">A−</button><button data-zoom="2" aria-label="增大回答字号" data-i18n-aria="increaseAnswerFont">A+</button></span><span id="mode"></span></header>
<main>
<div class="history" aria-label="回答记录" data-i18n-aria="answerHistory"><button data-action="previous" data-i18n="previous">上一条</button><span id="p" aria-label="当前回答位置" data-i18n-aria="answerPosition"></span><button data-action="next" data-i18n="next">下一条</button></div>
<div id="q"></div><div id="a" aria-label="建议回答" data-i18n-aria="suggestedAnswer" data-i18n="connectMacPlaceholder">连接 Mac 后，当前问题和回答会显示在这里。</div><div id="cand"></div><div id="sources"></div><button id="update" hidden data-action="applyWeb" data-i18n="showVerificationUpdate">显示核查更新</button>
</main>
<nav aria-label="回答操作" data-i18n-aria="answerActions"><div class="controls">
<div id="operation" role="status" aria-live="polite"></div><button data-retry hidden data-i18n="retryAction">重试操作</button>
<div class="actions"><button class="primary" data-action="answer" data-i18n="answer">回答</button><button class="secondary" data-action="cancel" data-i18n="stopGenerating">停止生成</button></div>
<div class="actions"><button data-action="shorter" data-i18n="shorter">更简短</button><button data-action="example" data-i18n="example">举例</button><button data-action="english" data-i18n="englishVersion">英文版</button></div>
</div></nav>
<script type="module" src="/phone.js"></script></body></html>
